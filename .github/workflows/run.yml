name: Generate QKD Report MD

on:
  workflow_dispatch: # 这个神奇的配置允许你在网页上手动点按钮运行！
  schedule:
    - cron: '0 1 * * 1' # 保留每周一自动运行一次的兜底功能

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 给予云电脑把你生成的 md 文件写回仓库的权限

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # <--- 加上这一行，获取完整历史记录

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Packages
        run: pip install arxiv openai

      - name: Run Script to Generate MD file
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python qkd_tracker.py

      - name: Commit and Push the MD file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add new QKD report MD file"
          branch: main
          file_pattern: '*.md'
